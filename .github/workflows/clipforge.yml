
name: ClipForge AI

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct MP4 or authorized Googlevideo playback URL"
        required: true
        type: string
      clip_count:
        description: "Number of clips (1-5)"
        required: true
        default: "2"
        type: string
      clip_duration:
        description: "Clip duration in seconds (15-60)"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  create-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download MP4 source
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          url = os.environ["VIDEO_URL"].strip()
          parsed = urllib.parse.urlparse(url)
          host = (parsed.hostname or "").lower()
          query = urllib.parse.parse_qs(parsed.query)

          if parsed.scheme != "https":
              raise SystemExit("Only HTTPS URLs are accepted.")

          is_googlevideo = (
              host == "googlevideo.com"
              or host.endswith(".googlevideo.com")
          )

          is_direct_mp4 = parsed.path.lower().endswith(".mp4")

          if is_googlevideo:
              if not parsed.path.endswith("/videoplayback"):
                  raise SystemExit(
                      "Googlevideo URL must use the videoplayback endpoint."
                  )
              mime = query.get("mime", [""])[0].lower()
              if mime != "video/mp4":
                  raise SystemExit(
                      "Googlevideo URL must specify mime=video/mp4."
                  )
          elif not is_direct_mp4:
              raise SystemExit(
                  "Provide a direct .mp4 URL or a signed "
                  "googlevideo.com/videoplayback URL for video/mp4."
              )

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "ClipForge-AI/1.0"}
          )

          limit = 1_000_000_000
          total = 0

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  final = urllib.parse.urlparse(response.geturl())
                  final_host = (final.hostname or "").lower()

                  final_is_googlevideo = (
                      final_host == "googlevideo.com"
                      or final_host.endswith(".googlevideo.com")
                  )

                  if final.scheme != "https":
                      raise SystemExit("Video redirected to a non-HTTPS URL.")

                  if not (
                      final.path.lower().endswith(".mp4")
                      or final_is_googlevideo
                  ):
                      raise SystemExit(
                          "Video redirected to an unsupported host."
                      )

                  content_type = response.headers.get(
                      "Content-Type", ""
                  ).split(";")[0].strip().lower()

                  if content_type not in ("video/mp4", "application/octet-stream"):
                      raise SystemExit(
                          "Server did not return MP4 data. "
                          f"Content-Type: {content_type}"
                      )

                  length = response.headers.get("Content-Length")
                  if length and int(length) > limit:
                      raise SystemExit("Maximum download size is 1 GB.")

                  with open("source.mp4", "wb") as output:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break

                          total += len(chunk)
                          if total > limit:
                              raise SystemExit(
                                  "Maximum download size is 1 GB."
                              )

                          output.write(chunk)

          except urllib.error.HTTPError as exc:
              if exc.code in (401, 403, 410):
                  raise SystemExit(
                      "The video URL was rejected or has expired. "
                      "Obtain a fresh authorized link from the owner."
                  )
              raise SystemExit(f"Video download failed: HTTP {exc.code}")
          except urllib.error.URLError as exc:
              raise SystemExit(f"Video download failed: {exc.reason}")

          if total == 0:
              raise SystemExit("Downloaded file is empty.")
          PY

          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_type \
            -of csv=p=0 source.mp4

      - name: Validate clip settings
        env:
          CLIP_COUNT: ${{ inputs.clip_count }}
          CLIP_DURATION: ${{ inputs.clip_duration }}
        run: |
          python3 - <<'PY'
          import os

          try:
              count = int(os.environ["CLIP_COUNT"])
              duration = int(os.environ["CLIP_DURATION"])
          except ValueError:
              raise SystemExit("Clip count and duration must be numbers.")

          if not 1 <= count <= 5:
              raise SystemExit("Clip count must be between 1 and 5.")

          if not 15 <= duration <= 60:
              raise SystemExit(
                  "Clip duration must be between 15 and 60 seconds."
              )
          PY

      - name: Create vertical clips
        env:
          CLIP_COUNT: ${{ inputs.clip_count }}
          CLIP_DURATION: ${{ inputs.clip_duration }}
        run: |
          set -euo pipefail
          mkdir -p clips

          TOTAL=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 source.mp4)

          python3 - "$TOTAL" "$CLIP_DURATION" <<'PY'
          import sys
          total, length = map(float, sys.argv[1:])
          if total < length:
              raise SystemExit(
                  "Source video is shorter than the requested duration."
              )
          PY

          for i in $(seq 1 "$CLIP_COUNT"); do
            START=$(python3 - "$TOTAL" "$CLIP_DURATION" \
              "$i" "$CLIP_COUNT" <<'PY'
          import sys
          total, length, index, count = map(float, sys.argv[1:])
          available = max(0, total - length)
          print(available * (index - 1) / max(1, count - 1))
          PY
          )

            ffmpeg -hide_banner -loglevel error -y \
              -ss "$START" -i source.mp4 \
              -t "$CLIP_DURATION" \
              -map 0:v:0 -map '0:a?' \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
              -c:v libx264 -preset ultrafast -crf 24 \
              -pix_fmt yuv420p \
              -c:a aac -b:a 128k \
              -movflags +faststart \
              "clips/clip-${i}.mp4"

            test -s "clips/clip-${i}.mp4"
          done

      - name: Upload clips as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-clips
          path: clips/*.mp4
          if-no-files-found: error
          retention-days: 3
          

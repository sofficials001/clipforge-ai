
name: ClipForge AI

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube video URL"
        required: true
        type: string
      clip_count:
        description: "Number of clips (1-5)"
        required: true
        default: "2"
        type: string
      clip_duration:
        description: "Clip duration in seconds (15-60)"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  create-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python -m pip install --break-system-packages yt-dlp

      - name: Download YouTube video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          python -m yt_dlp \
            --no-playlist \
            --max-filesize 1G \
            -f "bv*[height<=1080]+ba/b[height<=1080]" \
            --merge-output-format mp4 \
            -o "source.%(ext)s" \
            "$VIDEO_URL"

          SOURCE=$(find . -maxdepth 1 -type f \
            -name 'source.*' \
            ! -name '*.part' | head -n 1)

          if [ -z "$SOURCE" ]; then
            echo "Video download failed."
            exit 1
          fi

          mv "$SOURCE" source.mp4

      - name: Create vertical clips
        env:
          CLIP_COUNT: ${{ inputs.clip_count }}
          CLIP_DURATION: ${{ inputs.clip_duration }}
        run: |
          set -euo pipefail

          [[ "$CLIP_COUNT" =~ ^[1-5]$ ]] || {
            echo "Clip count must be 1-5."
            exit 1
          }

          [[ "$CLIP_DURATION" =~ ^(15|[1-5][0-9]|60)$ ]] || {
            echo "Clip duration must be 15-60 seconds."
            exit 1
          }

          mkdir -p clips

          TOTAL=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 source.mp4)

          python -c 'import sys; assert float(sys.argv[1]) > 0' "$TOTAL"

          for i in $(seq 1 "$CLIP_COUNT"); do
            START=$(python - "$TOTAL" "$CLIP_DURATION" "$i" "$CLIP_COUNT" <<'PY'
          import sys
          total, length, index, count = map(float, sys.argv[1:])
          available = max(0, total - length)
          print(available * (index - 1) / max(1, count - 1))
          PY
          )

            ffmpeg -hide_banner -loglevel error -y \
              -ss "$START" -i source.mp4 \
              -t "$CLIP_DURATION" \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
              -an -c:v libx264 -preset ultrafast -crf 24 \
              -pix_fmt yuv420p \
              "clips/clip-${i}.mp4"

            test -s "clips/clip-${i}.mp4"
          done

      - name: Upload clips as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-clips
          path: clips/*.mp4
          retention-days: 3
          

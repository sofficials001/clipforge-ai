
name: ClipForge AI

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct HTTPS MP4 file URL"
        required: true
        type: string
      clip_count:
        description: "Number of clips (1-5)"
        required: true
        default: "2"
        type: string
      clip_duration:
        description: "Clip duration in seconds (15-60)"
        required: true
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  create-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download MP4 video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import urllib.parse
          import urllib.request

          url = os.environ["VIDEO_URL"].strip()
          parsed = urllib.parse.urlparse(url)

          if parsed.scheme != "https":
              raise SystemExit("Only HTTPS URLs are allowed.")

          if not parsed.path.lower().endswith(".mp4"):
              raise SystemExit("Please provide a direct URL ending in .mp4.")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "ClipForge-AI/1.0"}
          )

          limit = 1_000_000_000
          total = 0

          with urllib.request.urlopen(request, timeout=60) as response:
              content_type = response.headers.get("Content-Type", "").lower()

              if "video" not in content_type and "octet-stream" not in content_type:
                  raise SystemExit(
                      "The URL did not return an MP4 video file. "
                      f"Content-Type: {content_type}"
                  )

              with open("source.mp4", "wb") as output:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break

                      total += len(chunk)
                      if total > limit:
                          raise SystemExit("Maximum file size is 1 GB.")

                      output.write(chunk)

          if not os.path.isfile("source.mp4") or os.path.getsize("source.mp4") == 0:
              raise SystemExit("The downloaded file is empty.")
          PY

          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 source.mp4

      - name: Validate clip settings
        env:
          CLIP_COUNT: ${{ inputs.clip_count }}
          CLIP_DURATION: ${{ inputs.clip_duration }}
        run: |
          python3 - <<'PY'
          import os

          try:
              count = int(os.environ["CLIP_COUNT"])
              duration = int(os.environ["CLIP_DURATION"])
          except ValueError:
              raise SystemExit("Clip count and duration must be numbers.")

          if not 1 <= count <= 5:
              raise SystemExit("Clip count must be between 1 and 5.")

          if not 15 <= duration <= 60:
              raise SystemExit("Clip duration must be between 15 and 60 seconds.")
          PY

      - name: Create vertical clips
        env:
          CLIP_COUNT: ${{ inputs.clip_count }}
          CLIP_DURATION: ${{ inputs.clip_duration }}
        run: |
          set -euo pipefail
          mkdir -p clips

          TOTAL=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 source.mp4)

          python3 - "$TOTAL" "$CLIP_DURATION" <<'PY'
          import sys
          total, length = map(float, sys.argv[1:])
          if total < length:
              raise SystemExit("Video is shorter than the requested clip duration.")
          PY

          for i in $(seq 1 "$CLIP_COUNT"); do
            START=$(python3 - "$TOTAL" "$CLIP_DURATION" \
              "$i" "$CLIP_COUNT" <<'PY'
          import sys
          total, length, index, count = map(float, sys.argv[1:])
          available = max(0, total - length)
          print(available * (index - 1) / max(1, count - 1))
          PY
          )

            ffmpeg -hide_banner -loglevel error -y \
              -ss "$START" -i source.mp4 \
              -t "$CLIP_DURATION" \
              -map 0:v:0 -map '0:a?' \
              -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" \
              -c:v libx264 -preset ultrafast -crf 24 \
              -pix_fmt yuv420p \
              -c:a aac -b:a 128k \
              -movflags +faststart \
              "clips/clip-${i}.mp4"

            test -s "clips/clip-${i}.mp4"
          done

      - name: Upload clips as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-clips
          path: clips/*.mp4
          if-no-files-found: error
          retention-days: 3
